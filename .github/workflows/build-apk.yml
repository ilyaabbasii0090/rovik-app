name: Build Rovik APK

on:
  push:
    branches: [main]
    paths:
      - 'rovik_app/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: rovik_app
        run: flutter pub get

      - name: Analyze
        working-directory: rovik_app
        run: flutter analyze

      - name: Test
        working-directory: rovik_app
        run: flutter test

      - name: Build release APK
        working-directory: rovik_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rovik-release-apk
          path: rovik_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
